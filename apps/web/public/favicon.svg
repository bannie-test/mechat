<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>iemanchat</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aaefc"/>
      <stop offset="1" stop-color="#1f66d1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f88e8"/>
      <stop offset="1" stop-color="#1f5fc4"/>
    </linearGradient>
  </defs>
  <style>
    /* 5s loop: dots wave twice → dots shrink away → "iêm" then "Ắn" pop in → fade → repeat */
    .dot { transform-box: fill-box; transform-origin: center; animation: wave 5s ease-in-out infinite both; }
    .d2 { animation-delay: 0.12s; }
    .d3 { animation-delay: 0.24s; }
    @keyframes wave {
      0%, 16%, 32% { transform: translateY(0) scale(1); opacity: 1; }
      8%, 24% { transform: translateY(-26px) scale(1); opacity: 1; }
      38% { transform: translateY(0) scale(1); opacity: 1; }
      44%, 88% { transform: translateY(0) scale(0.2); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .word { transform-box: fill-box; transform-origin: 50% 70%; animation: pop 5s cubic-bezier(.25,.8,.35,1.1) infinite both; }
    .w2 { animation-delay: 0.18s; }
    @keyframes pop {
      0%, 44% { transform: translateY(14px) scale(0.5); opacity: 0; }
      52% { transform: translateY(0) scale(1.04); opacity: 1; }
      56%, 82% { transform: translateY(0) scale(1); opacity: 1; }
      88%, 100% { transform: translateY(-6px) scale(0.96); opacity: 0; }
    }
    .tail { transform-box: fill-box; transform-origin: 20% 0%; animation: nudge 5s ease-in-out infinite; }
    @keyframes nudge { 0%, 40%, 60%, 100% { transform: rotate(0); } 48% { transform: rotate(-6deg); } }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0; }
      .word, .tail { animation: none; }
    }
  </style>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- bubble + tail -->
  <path class="tail" d="M150 330 L132 392 Q129 404 141 399 L222 352 Z" fill="#fff"/>
  <rect x="84" y="128" width="344" height="228" rx="72" fill="#fff"/>

  <!-- typing dots -->
  <circle class="dot d1" cx="196" cy="244" r="22" fill="url(#ink)"/>
  <circle class="dot d2" cx="256" cy="244" r="22" fill="url(#ink)"/>
  <circle class="dot d3" cx="316" cy="244" r="22" fill="url(#ink)"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif" font-weight="800" font-size="78" fill="url(#ink)">
    <text class="word w1" x="244" y="274" text-anchor="end">iêm</text>
    <text class="word w2" x="264" y="274" text-anchor="start">Ắn</text>
  </g>
</svg>
