  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- bubble + tail -->
  <path d="M150 330 L132 392 Q129 404 141 399 L222 352 Z" fill="#fff"/>
  <rect x="84" y="128" width="344" height="228" rx="72" fill="#fff"/>

