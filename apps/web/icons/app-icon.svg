<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>iemanchat</title>
  <!-- Static app icon (source for the PNGs). The animated version is public/favicon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aaefc"/>
      <stop offset="1" stop-color="#1f66d1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f88e8"/>
      <stop offset="1" stop-color="#1f5fc4"/>
    </linearGradient>
