  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif" font-weight="800" font-size="78" fill="url(#ink)">
    <text x="244" y="274" text-anchor="end">iêm</text>
