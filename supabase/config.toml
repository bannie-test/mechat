# Supabase CLI config (used for `supabase start` locally and `supabase functions deploy`).
project_id = "iemanchat"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your iemanchat sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Welcome to iemanchat — your code"
content_path = "./supabase/templates/magic_link.html"

[functions.push]
verify_jwt = false
