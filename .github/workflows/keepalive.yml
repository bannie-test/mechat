# Free-tier Supabase projects pause after 7 days without activity. Ping once a day.
name: Keep Supabase awake
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/check_invite" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}'
