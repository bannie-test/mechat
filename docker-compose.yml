# VPS deployment: `docker compose up -d --build`
# Reads Supabase settings from .env (same file as local dev). Put a TLS proxy in front
# (Caddy example in docker/Caddyfile) — push notifications and mic need HTTPS.
services:
  web:
    build: { context: ., args: { APP_DIR: apps/web } }
    image: iemanchat-web
    env_file: .env
    restart: unless-stopped
    ports: ["8080:80"]

